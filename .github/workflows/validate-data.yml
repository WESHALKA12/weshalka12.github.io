name: Проверка данных сайта
on:
  push:
    paths: ['data/**', 'assets/images/**', 'admin/**', 'tools/validate_data.py', 'tools/validate_admin.py']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate_data.py
      - run: python3 tools/validate_admin.py
