<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>THE | WESHALKA — Управление сайтом</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="/admin/config.yml" type="application/yaml" rel="cms-config-url">
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f8f6f2;
  }

  /* Всплывающее уведомление об оптимизации */
  #optimize-toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 100000;
    display: none;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: #1e1e1e;
    color: #fff;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    font-size: 13px;
    animation: toastSlideIn 0.3s ease;
  }
  @keyframes toastSlideIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

</style>
<script>
/**
 * THE | WESHALKA — Автоматический оптимизатор изображений и защита от ошибок
 * 1. Сжимает фото прямо в браузере (до 1920px, JPEG 0.84) перед отправкой в GitHub.
 * 2. Уменьшает размер каждого фото с 5-15 МБ до ~250-400 КБ (в 20-30 раз быстрее).
 * 3. Конвертирует HEIC (iPhone) в стандартный Web JPEG.
 * 4. Предотвращает ошибку "Failed to fetch" при сохранении.
 * 5. Автоматически повторяет сетевые запросы при временных перебоях.
 */
(function() {
  'use strict';

  function showToast(text, duration = 4000) {
    let toast = document.getElementById('optimize-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'optimize-toast';
      document.body.appendChild(toast);
    }
    toast.innerHTML = text;
    toast.style.display = 'flex';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.display = 'none'; }, duration);
  }

  // Оптимизация изображения через Canvas
  async function optimizeImage(file, maxDimension = 1920, quality = 0.84) {
    const isImage = file.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name);
    if (!isImage) return file;
    const isHeic = /\.(heic|heif)$/i.test(file.name) || file.type.includes('heic');

    // Если файл уже маленький (< 350 КБ) и не HEIC/PNG, не пережимаем
    if (file.size < 350 * 1024 && !isHeic && !file.type.includes('png')) {
      return file;
    }

    try {
      let bitmap;
      try {
        bitmap = await createImageBitmap(file);
      } catch (err) {
        // Fallback через HTMLImageElement
        const blobUrl = URL.createObjectURL(file);
        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = blobUrl;
        });
        URL.revokeObjectURL(blobUrl);
        bitmap = img;
      }

      let width = bitmap.width;
      let height = bitmap.height;
      if (width > maxDimension || height > maxDimension) {
        if (width > height) {
          height = Math.round((height * maxDimension) / width);
          width = maxDimension;
        } else {
          width = Math.round((width * maxDimension) / height);
          height = maxDimension;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bitmap, 0, 0, width, height);

      const blob = await new Promise((resolve) => {
        canvas.toBlob(resolve, 'image/jpeg', quality);
      });

      if (!blob) return file;

      const cleanName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
      return new File([blob], cleanName, { type: 'image/jpeg', lastModified: Date.now() });
    } catch (e) {
      console.warn('[THE | WESHALKA] Ошибка при сжатии фото, используем оригинал:', e);
      return file;
    }
  }

  // Перехват выбора файлов в <input type="file">
  document.addEventListener('change', async function(event) {
    const input = event.target;
    if (!(input instanceof HTMLInputElement) || input.type !== 'file' || !input.files || input.files.length === 0) return;
    if (input._optimizing || input._optimized) return;

    const files = Array.from(input.files);
    const hasLargeImages = files.some((f) => (f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif)$/i.test(f.name)) && f.size > 350 * 1024);
    const hasLargeVideo = files.some((f) => f.type.startsWith('video/') && f.size > 15 * 1024 * 1024);

    if (hasLargeVideo) {
      alert('⚠️ Внимание: одно из выбранных видео весит больше 15 МБ.\nРекомендуем обрезать его до 10–15 секунд, иначе оно может долго загружаться или вызывать ошибку связи с GitHub.');
    }

    if (!hasLargeImages) return;

    event.stopImmediatePropagation();
    event.preventDefault();

    input._optimizing = true;
    showToast('⏳ Оптимизируем фотографии для быстрой загрузки...');

    try {
      const optimizedFiles = [];
      let totalOriginalSize = 0;
      let totalNewSize = 0;

      for (const file of files) {
        totalOriginalSize += file.size;
        const opt = await optimizeImage(file);
        totalNewSize += opt.size;
        optimizedFiles.push(opt);
      }

      const dt = new DataTransfer();
      for (const f of optimizedFiles) {
        dt.items.add(f);
      }
      input.files = dt.files;
      input._optimized = true;

      const mbBefore = (totalOriginalSize / (1024 * 1024)).toFixed(1);
      const mbAfter = (totalNewSize / (1024 * 1024)).toFixed(1);
      showToast(`✨ Фотографии оптимизированы: <b>${mbBefore} МБ → ${mbAfter} МБ</b>. Сохранение пройдёт быстро!`);

      input.dispatchEvent(new Event('change', { bubbles: true }));
    } catch (err) {
      console.error('[THE | WESHALKA] Ошибка оптимизации файлов:', err);
    } finally {
      input._optimizing = false;
      setTimeout(() => { input._optimized = false; }, 500);
    }
  }, true);

  // Дополнительная защита: перехват File.prototype.arrayBuffer
  const origArrayBuffer = File.prototype.arrayBuffer;
  File.prototype.arrayBuffer = async function() {
    if (this._compressedBuffer) return this._compressedBuffer;
    const isImg = this.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|heif)$/i.test(this.name);
    if (isImg && this.size > 400 * 1024) {
      try {
        const compressed = await optimizeImage(this);
        const buf = await origArrayBuffer.call(compressed);
        this._compressedBuffer = buf;
        return buf;
      } catch (e) {
        console.warn('[THE | WESHALKA] Ошибка пред-сжатия буфера:', e);
      }
    }
    return origArrayBuffer.call(this);
  };

  // Защита сетевых запросов к GitHub API от временных сбоев
  const origFetch = window.fetch;
  window.fetch = async function(resource, init) {
    const url = typeof resource === 'string' ? resource : (resource && resource.url) || '';
    const isGitHub = url.includes('api.github.com');
    let retries = isGitHub ? 3 : 0;
    let delay = 1000;

    while (true) {
      try {
        const response = await origFetch(resource, init);
        if (isGitHub && [502, 503, 504].includes(response.status) && retries > 0) {
          retries--;
          await new Promise((r) => setTimeout(r, delay));
          delay *= 1.5;
          continue;
        }
        return response;
      } catch (err) {
        if (retries > 0) {
          retries--;
          console.warn(`[THE | WESHALKA] Повтор запроса к GitHub API (${3 - retries}/3)...`, err);
          await new Promise((r) => setTimeout(r, delay));
          delay *= 1.5;
          continue;
        }
        throw err;
      }
    }
  };

})();
</script>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.265.1/dist/sveltia-cms.js" integrity="sha384-Rs76zb0N6jGnlNeY5H9UOm/U4X0xaxs76p99e7k97kIMkItv185KqUqGC+exMqRA" crossorigin="anonymous"></script>
</body>
</html>
